  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  
<!-- Persistent Currency, Language & Auto-Detection Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rates = { USD: 1.0, EUR: 0.92, CAD: 1.37, GBP: 0.78, DOP: 60.0 };
      const symbols = { USD: '$', EUR: '€', CAD: 'CA$', GBP: '£', DOP: 'RD$ ' };
      const currencyToLang = { USD: 'en', CAD: 'en', GBP: 'en', DOP: 'es', EUR: 'de' };
      const langToCurrency = { en: 'USD', es: 'DOP', fr: 'EUR', de: 'EUR', it: 'EUR' };

      const currencySelect = document.getElementById('currency-select');
      const langSelect = document.getElementById('language-select');

      const setGoogleTranslateCookie = (lang) => {
        if (lang === 'en') {
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;
        } else {
          document.cookie = `googtrans=/en/${lang}; path=/;`;
          document.cookie = `googtrans=/en/${lang}; path=/; domain=${window.location.hostname}`;
        }
      };

      const getCookie = (name) => {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      };

      // --- AUTO-DETECTION ENGINE ---
      const hasManualOverride = localStorage.getItem('og_vip_manual_override') === 'true';

      if (!hasManualOverride) {
        const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        const timeZone = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();

        // 1. System Language Detection
        let detectedLang = 'en';
        if (userLang.startsWith('es')) detectedLang = 'es';
        else if (userLang.startsWith('fr')) detectedLang = 'fr';
        else if (userLang.startsWith('de')) detectedLang = 'de';
        else if (userLang.startsWith('it')) detectedLang = 'it';

        // 2. System Location & Currency Detection
        let detectedCurrency = 'USD';
        if (userLang.includes('-ca') || userLang === 'fr-ca' || timeZone.includes('toronto') || timeZone.includes('vancouver') || timeZone.includes('montreal')) {
          detectedCurrency = 'CAD';
        } else if (userLang.includes('-gb') || userLang === 'en-gb' || timeZone.includes('london')) {
          detectedCurrency = 'GBP';
        } else if (userLang.includes('-do') || timeZone.includes('santo_domingo')) {
          detectedCurrency = 'DOP';
          detectedLang = 'es';
        } else if (['de', 'it'].some(l => userLang.startsWith(l)) || userLang === 'fr-fr' || userLang === 'es-es' || timeZone.includes('europe') || timeZone.includes('berlin') || timeZone.includes('paris') || timeZone.includes('rome') || timeZone.includes('madrid')) {
          detectedCurrency = 'EUR';
        }

        // Apply instant client-side defaults if not already stored
        if (!localStorage.getItem('og_vip_currency')) {
          localStorage.setItem('og_vip_currency', detectedCurrency);
        }
        if (!getCookie('googtrans') && detectedLang !== 'en') {
          setGoogleTranslateCookie(detectedLang);
        }

        // 3. IP Location Refinement (Runs once on first visit)
        if (!localStorage.getItem('og_vip_ip_checked')) {
          fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
              localStorage.setItem('og_vip_ip_checked', 'true');
              if (data && data.country_code) {
                const cc = data.country_code;
                let ipCurr = 'USD';
                let ipLang = 'en';

                if (cc === 'DO') { ipCurr = 'DOP'; ipLang = 'es'; }
                else if (cc === 'CA') { ipCurr = 'CAD'; }
                else if (cc === 'GB') { ipCurr = 'GBP'; }
                else if (['DE', 'FR', 'IT', 'ES', 'AT', 'BE', 'NL', 'IE', 'PT', 'FI', 'GR'].includes(cc)) {
                  ipCurr = 'EUR';
                  if (['DE', 'FR', 'IT', 'ES'].includes(cc)) ipLang = cc.toLowerCase();
                }

                const currentSaved = localStorage.getItem('og_vip_currency');
                if (currentSaved !== ipCurr) {
                  localStorage.setItem('og_vip_currency', ipCurr);
                  if (ipLang !== 'en') setGoogleTranslateCookie(ipLang);
                  location.reload();
                }
              }
            })
            .catch(() => {
              localStorage.setItem('og_vip_ip_checked', 'true');
            });
        }
      }

      // --- RENDER & RECOVERY ---
      let activeCurrency = localStorage.getItem('og_vip_currency') || 'USD';
      const currentTrans = getCookie('googtrans');
      let activeLang = 'en';
      if (currentTrans) {
        const langCode = currentTrans.split('/').pop();
        if (['en', 'es', 'fr', 'de', 'it'].includes(langCode)) {
          activeLang = langCode;
        }
      }

      if (currencySelect) currencySelect.value = activeCurrency;
      if (langSelect) langSelect.value = activeLang;

      const updatePrices = (curr) => {
        const rate = rates[curr] || 1.0;
        const sym = symbols[curr] || '$';

        document.querySelectorAll('[data-usd-min]').forEach(el => {
          const minVal = parseFloat(el.getAttribute('data-usd-min'));
          const maxVal = parseFloat(el.getAttribute('data-usd-max'));
          if (!isNaN(minVal) && !isNaN(maxVal)) {
            const convMin = Math.round(minVal * rate);
            const convMax = Math.round(maxVal * rate);
            el.textContent = `${sym}${convMin.toLocaleString()} - ${sym}${convMax.toLocaleString()}+`;
          }
        });

        document.querySelectorAll('[data-usd]').forEach(el => {
          const usdVal = parseFloat(el.getAttribute('data-usd'));
          if (!isNaN(usdVal)) {
            const converted = Math.round(usdVal * rate);
            el.textContent = `${sym}${converted.toLocaleString()}`;
          }
        });
      };

      updatePrices(activeCurrency);

      // --- USER EVENT HANDLERS (Flags manual override) ---
      if (currencySelect) {
        currencySelect.addEventListener('change', (e) => {
          const newCurr = e.target.value;
          localStorage.setItem('og_vip_manual_override', 'true');
          localStorage.setItem('og_vip_currency', newCurr);
          updatePrices(newCurr);

          let targetLang = currencyToLang[newCurr];
          if (newCurr === 'CAD' && activeLang === 'fr') targetLang = 'fr';
          if (newCurr === 'EUR' && ['fr', 'it', 'de', 'es'].includes(activeLang)) targetLang = activeLang;

          if (langSelect && activeLang !== targetLang) {
            langSelect.value = targetLang;
            setGoogleTranslateCookie(targetLang);
            location.reload();
          }
        });
      }

      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          const newLang = e.target.value;
          localStorage.setItem('og_vip_manual_override', 'true');
          setGoogleTranslateCookie(newLang);

          let targetCurr = langToCurrency[newLang];
          if (newLang === 'fr' && activeCurrency === 'CAD') targetCurr = 'CAD';
          if (newLang === 'en' && ['CAD', 'GBP'].includes(activeCurrency)) targetCurr = activeCurrency;

          if (targetCurr) {
            localStorage.setItem('og_vip_currency', targetCurr);
          }

          location.reload();
        });
      }

      // Mobile Menu Toggle
      const menuBtn = document.getElementById('menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });
      }
    });
  </script>
