<!-- Persistent Currency, Language, URL Tracking & Auto-Detection Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rates = { USD: 1.0, EUR: 0.92, CAD: 1.37, GBP: 0.78, DOP: 60.0 };
      const symbols = { USD: '$', EUR: '€', CAD: 'CA$', GBP: '£', DOP: 'RD$ ' };
      const currencyToLang = { USD: 'en', CAD: 'en', GBP: 'en', DOP: 'es', EUR: 'de' };
      const langToCurrency = { en: 'USD', es: 'DOP', fr: 'EUR', de: 'EUR', it: 'EUR' };

      const currencySelect = document.getElementById('currency-select');
      const langSelect = document.getElementById('language-select');

      const setGoogleTranslateCookie = (lang) => {
        if (lang === 'en') {
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + window.location.hostname;
        } else {
          document.cookie = `googtrans=/en/${lang}; path=/;`;
          document.cookie = `googtrans=/en/${lang}; path=/; domain=${window.location.hostname}`;
        }
      };

      const getCookie = (name) => {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      };

      const validLangs = ['en', 'es', 'fr', 'de', 'it'];
      const validCurrs = ['USD', 'EUR', 'CAD', 'GBP', 'DOP'];

      // 1. Read URL Parameters
      const urlParams = new URLSearchParams(window.location.search);
      let urlLang = urlParams.get('lang')?.toLowerCase();
      let urlCurr = urlParams.get('curr')?.toUpperCase();

      if (!validLangs.includes(urlLang)) urlLang = null;
      if (!validCurrs.includes(urlCurr)) urlCurr = null;

      // 2. Determine Active State Priority (URL > Cookie/localStorage > Auto-Detect)
      let activeLang = urlLang;
      let activeCurr = urlCurr;

      if (urlLang || urlCurr) {
        localStorage.setItem('og_vip_manual_override', 'true');
        if (urlLang) setGoogleTranslateCookie(urlLang);
        if (urlCurr) localStorage.setItem('og_vip_currency', urlCurr);
      }

      if (!activeLang) {
        const currentTrans = getCookie('googtrans');
        if (currentTrans) {
          const code = currentTrans.split('/').pop();
          if (validLangs.includes(code)) activeLang = code;
        }
      }

      if (!activeCurr) {
        activeCurr = localStorage.getItem('og_vip_currency');
      }

      // Auto-Detection Fallback
      const hasManualOverride = localStorage.getItem('og_vip_manual_override') === 'true';
      if ((!activeLang || !activeCurr) && !hasManualOverride) {
        const userLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        const timeZone = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();

        if (!activeLang) {
          if (userLang.startsWith('es')) activeLang = 'es';
          else if (userLang.startsWith('fr')) activeLang = 'fr';
          else if (userLang.startsWith('de')) activeLang = 'de';
          else if (userLang.startsWith('it')) activeLang = 'it';
          else activeLang = 'en';
        }

        if (!activeCurr) {
          if (userLang.includes('-ca') || userLang === 'fr-ca' || timeZone.includes('toronto') || timeZone.includes('vancouver') || timeZone.includes('montreal')) activeCurr = 'CAD';
          else if (userLang.includes('-gb') || userLang === 'en-gb' || timeZone.includes('london')) activeCurr = 'GBP';
          else if (userLang.includes('-do') || timeZone.includes('santo_domingo')) { activeCurr = 'DOP'; activeLang = 'es'; }
          else if (['de', 'it'].some(l => userLang.startsWith(l)) || userLang === 'fr-fr' || userLang === 'es-es' || timeZone.includes('europe')) activeCurr = 'EUR';
          else activeCurr = 'USD';
        }
      }

      // Apply Defaults
      activeLang = activeLang || 'en';
      activeCurr = activeCurr || 'USD';

      localStorage.setItem('og_vip_currency', activeCurr);

      if (currencySelect) currencySelect.value = activeCurr;
      if (langSelect) langSelect.value = activeLang;

      // 3. Update Address Bar URL
      const currentUrl = new URL(window.location.href);
      currentUrl.searchParams.set('lang', activeLang);
      currentUrl.searchParams.set('curr', activeCurr);
      window.history.replaceState({}, '', currentUrl.toString());

      // 4. Dynamically Attach Query Params to all Navigation Links
      document.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('https://wa.me') && !href.startsWith('#') && !href.startsWith('mailto:')) {
          try {
            const linkUrl = new URL(href, window.location.origin);
            linkUrl.searchParams.set('lang', activeLang);
            linkUrl.searchParams.set('curr', activeCurr);
            a.setAttribute('href', linkUrl.pathname + linkUrl.search + linkUrl.hash);
          } catch(e) {}
        }
      });

      // 5. Price Rendering
      const updatePrices = (curr) => {
        const rate = rates[curr] || 1.0;
        const sym = symbols[curr] || '$';

        document.querySelectorAll('[data-usd-min]').forEach(el => {
          const minVal = parseFloat(el.getAttribute('data-usd-min'));
          const maxVal = parseFloat(el.getAttribute('data-usd-max'));
          if (!isNaN(minVal) && !isNaN(maxVal)) {
            const convMin = Math.round(minVal * rate);
            const convMax = Math.round(maxVal * rate);
            el.textContent = `${sym}${convMin.toLocaleString()} - ${sym}${convMax.toLocaleString()}+`;
          }
        });

        document.querySelectorAll('[data-usd]').forEach(el => {
          const usdVal = parseFloat(el.getAttribute('data-usd'));
          if (!isNaN(usdVal)) {
            const converted = Math.round(usdVal * rate);
            el.textContent = `${sym}${converted.toLocaleString()}`;
          }
        });
      };

      updatePrices(activeCurr);

      // 6. Currency Dropdown Handler with URL Redirect
      if (currencySelect) {
        currencySelect.addEventListener('change', (e) => {
          const newCurr = e.target.value;
          localStorage.setItem('og_vip_manual_override', 'true');
          localStorage.setItem('og_vip_currency', newCurr);

          let targetLang = currencyToLang[newCurr];
          if (newCurr === 'CAD' && activeLang === 'fr') targetLang = 'fr';
          if (newCurr === 'EUR' && ['fr', 'it', 'de', 'es'].includes(activeLang)) targetLang = activeLang;

          targetLang = targetLang || activeLang;
          setGoogleTranslateCookie(targetLang);

          const redirectUrl = new URL(window.location.href);
          redirectUrl.searchParams.set('lang', targetLang);
          redirectUrl.searchParams.set('curr', newCurr);
          window.location.href = redirectUrl.toString();
        });
      }

      // 7. Language Dropdown Handler with URL Redirect
      if (langSelect) {
        langSelect.addEventListener('change', (e) => {
          const newLang = e.target.value;
          localStorage.setItem('og_vip_manual_override', 'true');
          setGoogleTranslateCookie(newLang);

          let targetCurr = langToCurrency[newLang];
          if (newLang === 'fr' && activeCurr === 'CAD') targetCurr = 'CAD';
          if (newLang === 'en' && ['CAD', 'GBP'].includes(activeCurr)) targetCurr = activeCurr;

          targetCurr = targetCurr || activeCurr;
          localStorage.setItem('og_vip_currency', targetCurr);

          const redirectUrl = new URL(window.location.href);
          redirectUrl.searchParams.set('lang', newLang);
          redirectUrl.searchParams.set('curr', targetCurr);
          window.location.href = redirectUrl.toString();
        });
      }

      // Mobile Menu Toggle
      const menuBtn = document.getElementById('menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });
      }
    });
  </script>
